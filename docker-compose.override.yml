services:
  open-webui:
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=${AGENT_API_KEY:?Define AGENT_API_KEY en .env}
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - AUDIO_STT_OPENAI_API_KEY=${AGENT_API_KEY:?Define AGENT_API_KEY en .env}
      - AUDIO_STT_MODEL=whisper-1
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - AUDIO_TTS_OPENAI_API_KEY=${AGENT_API_KEY:?Define AGENT_API_KEY en .env}
      - AUDIO_TTS_MODEL=tts-1
      - AUDIO_TTS_VOICE=alloy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  qdrant:
